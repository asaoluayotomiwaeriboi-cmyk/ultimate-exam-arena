<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="container" style="padding-top:40px">
    <section class="card" style="max-width:480px;margin:0 auto">
      <h2>Admin sign in</h2>
      <form id="admin-auth">
        <label class="label">Email</label><input class="input" type="email" required>
        <label class="label">Password</label><input class="input" type="password" required>
        <label class="label">Access code</label><input class="input" type="text" required>
        <div style="margin-top:12px"><button class="btn btn-primary">Sign in</button></div>
      </form>
      <p class="muted">Note: 5 failed attempts trigger a 30min lockout (placeholder)</p>
    </section>
  </main>
</body>
</html>
