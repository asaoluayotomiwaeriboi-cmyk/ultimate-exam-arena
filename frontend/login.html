<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">UEA</span>
        <span>Ultimate Exam Arena</span>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-outline" href="index.html">Home</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="brand" style="justify-content:center; margin-bottom:20px;">
        <span class="brand-mark">UEA</span>
        <span>Ultimate Exam Arena</span>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-bottom:18px;">Continue with Google</button>
      <div style="text-align:center; color:var(--text-muted); margin: 10px 0 18px;">──── OR ────</div>
      <form class="form-grid">
        <div>
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="••••••••" />
        </div>
        <div class="switch-row">
          <a href="index.html" class="muted">Forgot password?</a>
          <a href="signup.html" class="muted">Sign up</a>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;">Log in</button>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
