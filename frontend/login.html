<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="navbar"><div class="container"><div class="logo">UEA</div><div class="actions"><a class="btn-outline" href="index.html">Home</a></div></div></header>
  <main class="container" style="padding-top:24px">
    <section class="card" style="max-width:720px;margin:0 auto">
      <h2>Sign in</h2>
      <a class="btn-google" href="#">🔷 Sign in with Google</a>
      <div class="separator h-center" style="margin:12px 0">─── OR ───</div>
      <form class="auth-form">
        <label class="label">Email</label>
        <input class="input" type="email" placeholder="student@example.com">
        <label class="label">Password</label>
        <input class="input" type="password" placeholder="Enter your password">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><a href="#">Forgot password?</a><a href="signup.html">Sign up</a></div>
        <div style="margin-top:12px"><button class="btn btn-primary" type="submit">Login</button></div>
      </form>
    </section>
  </main>
<script src="js/auth.js"></script>
</body>
</html>
