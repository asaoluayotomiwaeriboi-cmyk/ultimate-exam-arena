<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results | Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header brand"><span class="brand-mark">UEA</span><span>Ultimate Exam Arena</span></div>
      <nav class="sidebar-nav">
        <a href="index.html"><span class="nav-emoji">🏠</span> Home</a>
        <a href="dashboard.html"><span class="nav-emoji">📚</span> Classroom</a>
        <a href="store.html"><span class="nav-emoji">🛒</span> Store</a>
        <a href="news.html"><span class="nav-emoji">📰</span> News</a>
        <a href="leaderboard.html"><span class="nav-emoji">🏆</span> Leaderboard</a>
        <a href="support.html"><span class="nav-emoji">📞</span> Support</a>
        <a href="about.html"><span class="nav-emoji">ℹ️</span> About</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand"><span class="brand-mark">UEA</span><span>Results</span></div>
          <div class="topbar-actions"><button class="nav-toggle" aria-label="Open menu">☰</button></div>
        </div>
      </header>

      <main class="content-panel">
        <div class="page-section">
          <div class="grid grid-4">
            <div class="card summary-card"><div class="muted">Score</div><div class="summary-value">280/400</div></div>
            <div class="card summary-card"><div class="muted">Rank</div><div class="summary-value">#12</div></div>
            <div class="card summary-card"><div class="muted">Accuracy</div><div class="summary-value">70%</div></div>
            <div class="card summary-card"><div class="muted">Streak</div><div class="summary-value">6</div></div>
          </div>
        </div>

        <div class="page-section">
          <div class="card section-card">
            <h3>Performance by subject</h3>
            <div class="stat-list">
              <div class="stat-item"><span>English</span><span>78%</span></div>
              <div class="performance-bar"><span style="width:78%"></span></div>
              <div class="stat-item"><span>Physics</span><span>72%</span></div>
              <div class="performance-bar"><span style="width:72%"></span></div>
              <div class="stat-item"><span>Chemistry</span><span>68%</span></div>
              <div class="performance-bar"><span style="width:68%"></span></div>
            </div>
          </div>
        </div>

        <div class="page-section">
          <div class="card section-card">
            <h3>Question review</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Subject</th><th>Correct</th><th>Accuracy</th></tr></thead>
                <tbody>
                  <tr><td>English</td><td>18</td><td>78%</td></tr>
                  <tr><td>Physics</td><td>16</td><td>72%</td></tr>
                  <tr><td>Chemistry</td><td>15</td><td>68%</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
</body>
</html>
