<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="navbar"><div class="container"><div class="logo">UEA</div><nav class="nav-links"><a href="index.html">Home</a><a href="news.html">News</a></nav><div class="actions"><a class="btn-outline" href="settings.html">Settings</a></div></div></header>
  <main class="container" style="padding-top:24px">
    <section class="row">
      <div class="card" style="flex:1;min-width:240px">
        <h3>Welcome back, Student</h3>
        <p class="meta">Quick stats</p>
        <div class="kv"><div>Score</div><div><strong>860</strong></div></div>
      </div>
      <div class="card" style="flex:2;min-width:320px">
        <h3>Recent activity</h3>
        <div id="recent-feed"></div>
      </div>
    </section>

    <section style="margin-top:20px">
      <h2>Your subjects</h2>
      <div class="grid grid-3">
        <div class="card">Mathematics</div>
        <div class="card">English</div>
        <div class="card">Physics</div>
      </div>
    </section>
  </main>
<script src="js/feed.js"></script>
</body>
</html>
