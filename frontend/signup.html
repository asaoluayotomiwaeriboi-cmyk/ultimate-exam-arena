<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up - Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="navbar"><div class="container"><div class="logo">UEA</div><div class="actions"><a class="btn-outline" href="index.html">Home</a></div></div></header>
  <main class="container" style="padding-top:24px">
    <section class="card" style="max-width:720px;margin:0 auto">
      <h2>Create Account</h2>
      <a class="btn-google" href="#">🔷 Sign up with Google</a>
      <div class="separator h-center" style="margin:12px 0">─── OR ───</div>
      <form class="auth-form">
        <label class="label">Full name</label><input class="input" name="name">
        <label class="label">Email</label><input class="input" type="email">
        <label class="label">Phone</label><input class="input" type="tel">
        <label class="label">Password</label><input class="input" type="password">
        <label class="label">Confirm password</label><input class="input" type="password">
        <label class="label">Date of birth</label><input class="input" type="date">
        <label class="label">State</label>
        <select class="input"><option>Select your state</option><option>Lagos</option></select>
        <label class="label">School (optional)</label><input class="input">
        <label class="checkbox"><input type="checkbox"> I agree to the terms</label>
        <div style="margin-top:12px"><button class="btn btn-primary">Create Account</button></div>
        <p class="muted">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </section>
  </main>
<script src="js/auth.js"></script>
</body>
</html>
