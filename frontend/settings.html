<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header brand"><span class="brand-mark">UEA</span><span>Ultimate Exam Arena</span></div>
      <nav class="sidebar-nav">
        <a href="index.html"><span class="nav-emoji">🏠</span> Home</a>
        <a href="dashboard.html"><span class="nav-emoji">📚</span> Classroom</a>
        <a href="store.html"><span class="nav-emoji">🛒</span> Store</a>
        <a href="news.html"><span class="nav-emoji">📰</span> News</a>
        <a href="leaderboard.html"><span class="nav-emoji">🏆</span> Leaderboard</a>
        <a href="support.html"><span class="nav-emoji">📞</span> Support</a>
        <a href="about.html"><span class="nav-emoji">ℹ️</span> About</a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand"><span class="brand-mark">UEA</span><span>Settings</span></div>
          <div class="topbar-actions"><button class="nav-toggle" aria-label="Open menu">☰</button></div>
        </div>
      </header>

      <main class="content-panel">
        <div class="card section-card">
          <h2>Profile settings</h2>
          <form class="form-grid">
            <div>
              <label>Display name</label>
              <input class="input" type="text" value="Ada" />
            </div>
            <div class="form-row">
              <div>
                <label>Email</label>
                <input class="input" type="email" value="ada@example.com" />
              </div>
              <div>
                <label>Notification mode</label>
                <select class="select"><option>Daily</option><option>Weekly</option></select>
              </div>
            </div>
            <div class="switch-row">
              <span>Dark mode</span>
              <span class="toggle on" aria-label="Dark mode enabled"></span>
            </div>
            <button class="btn btn-primary" type="submit">Save changes</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
