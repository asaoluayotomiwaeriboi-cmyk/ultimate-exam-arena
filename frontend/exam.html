         <div class="topbar-actions">

         </div>
       </div>
     </header>

     <main class="exam-main">
       <div class="exam-header">
         <div>
           <div class="badge">Question 01</div>
           <h2 style="margin:10px 0 0;">Physics</h2>
         </div>
         <div class="muted">12% complete</div>
       </div>
       <div class="progress"><span class="progress-bar" data-current="12" style="width:12%;"></span></div>

       <div class="question-box">
         <div class="question-number">01 of 180</div>
         <h3 style="font-size: clamp(1.6rem, 2.7vw, 2.6rem); margin:16px 0 18px; line-height:1.3;">A body moving in a straight line with uniform acceleration has which of the following characteristics?</h3>
         <div class="quiz-options">
           <button class="option-btn selected" type="button">A. Constant velocity throughout the motion</button>
           <button class="option-btn" type="button">B. Increasing acceleration at every second</button>
           <button class="option-btn" type="button">C. Constant acceleration in the same direction</button>
           <button class="option-btn" type="button">D. Zero displacement after a time interval</button>
         </div>
       </div>

       <div class="exam-actions">
         <a class="btn btn-outline" href="exam-setup.html">Previous</a>
         <div class="inline-btns">
           <button class="btn btn-secondary" type="button">Flag</button>
           <button class="btn btn-danger" type="button">Quit</button>
           <button class="btn btn-primary" type="button">Next</button>
         </div>
       </div>
