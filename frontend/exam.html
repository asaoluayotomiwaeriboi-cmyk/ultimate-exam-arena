<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exam - Ultimate Exam Arena</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/exam.css">
</head>
<body>
  <header class="navbar"><div class="container"><div class="logo">UEA</div></div></header>
  <main class="container" style="padding-top:24px">
    <section class="card exam-shell">
      <div class="timer">00:59:45</div>
      <div class="question card"><h3>Question 1</h3><p class="question-text">What is 2+2?</p></div>
      <div class="options">
        <button class="option-btn">A. 3</button>
        <button class="option-btn">B. 4</button>
        <button class="option-btn">C. 5</button>
        <button class="option-btn">D. 22</button>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn btn-outline">Previous</button><div><button class="btn btn-outline">Flag</button><button class="btn btn-primary">Next</button></div></div>
      <div class="navigator" style="margin-top:12px"> <div class="pill">1</div><div class="pill">2</div><div class="pill">3</div></div>
    </section>
  </main>
<script src="js/exam.js"></script>
</body>
</html>
